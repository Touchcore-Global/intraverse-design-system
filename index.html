<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      Per-route SEO (title, description, canonical, hreflang, og:*, twitter:*)
      is owned by react-helmet-async via src/components/SEO.tsx. During
      react-snap prerendering, src/main.tsx's snapSaveState waits for
      Helmet to flush and then removes any colliding static tags.

      Only sitewide identity tags remain here so social crawlers that
      don't execute JS still get something usable on un-prerendered
      routes. These are intentionally minimal: no canonical, no
      hreflang, no per-route og:url.
    -->
    <title>Intraverse</title>
    <meta name="description" content="Nigeria's B2B travel technology platform. Access GDS, NDC, and 900+ airlines through one API. White-label booking, agent tools, corporate travel." />
    <meta name="author" content="Intraverse" />

    <link rel="canonical" href="https://intraverse.africa/" />

    <link rel="alternate" hreflang="en-NG" href="https://intraverse.africa/" />
    <link rel="alternate" hreflang="en" href="https://intraverse.africa/" />
    <link rel="alternate" hreflang="x-default" href="https://intraverse.africa/" />

    <meta property="og:title" content="Intraverse" />
    <meta property="og:description" content="Sell flights, hotels, tours and travel services with Intraverse." />
    <meta property="og:image" content="https://intraverse.africa/og-image.jpg" />
    <meta property="og:url" content="https://intraverse.africa/" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
